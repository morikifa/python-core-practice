[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-cli-core"
version = "0.1.0"
description = "Professional production-ready task engine and CLI tracker"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matvey (morikifa)" }]
dependencies = []

[project.scripts]
taskflow = "taskflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src/taskflow --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
